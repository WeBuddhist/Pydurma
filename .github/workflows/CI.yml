name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:

    # ubuntu-latest (26.04) has no Python 3.9 anymore; 24.04 still has it
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.9
      uses: actions/setup-python@v5
      with:
        python-version: "3.9"
        
    - name: Install dependencies
      run: |
        pip install -U pip
        pip install .
        pip install .[dev]
        
    - name: Test with pytest
      run: |
        pytest
    
    - name: Test Coverage
      run: |
        coverage run -m pytest
        coverage report -m
