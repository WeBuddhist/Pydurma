name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:

    # ubuntu-latest (26.04) has no Python 3.9 anymore; 24.04 still has it
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.9
      uses: actions/setup-python@v5
      with:
        python-version: "3.9"
        
    - name: Install dependencies
      # some dependencies of openpecha (pyewts, PyYAML 5.4.1) are only available as
      # source and can't be built with recent setuptools (no pkg_resources) or Cython 3
      env:
        PIP_CONSTRAINT: ${{ github.workspace }}/build-constraints.txt
        # newer pip versions only apply build constraints from this one
        PIP_BUILD_CONSTRAINT: ${{ github.workspace }}/build-constraints.txt
      run: |
        printf 'setuptools<80\ncython<3\n' > "$PIP_CONSTRAINT"
        pip install -U pip
        pip install .
        pip install .[dev]
        
    - name: Test with pytest
      run: |
        pytest
    
    - name: Test Coverage
      run: |
        coverage run -m pytest
        coverage report -m
